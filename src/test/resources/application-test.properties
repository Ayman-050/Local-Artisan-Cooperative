# Tests run against in-memory H2 in PostgreSQL mode. Flyway applies the real migrations and Hibernate
# validates the result against the entities, so a broken migration fails the build.
spring.datasource.url=jdbc:h2:mem:artisan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=DATE,TIMESTAMP,TYPE,VALUE;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true
# Keep the background auction sync out of the way of the tests.
app.auctions.sync-interval-ms=3600000
