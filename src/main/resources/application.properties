spring.application.name=local-artisan-cooperative

server.port=5000
# Behind Replit's (or any) reverse proxy: trust X-Forwarded-* so redirects and secure cookies work.
server.forward-headers-strategy=framework

# --- Database ---
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# Templates still navigate lazy associations (e.g. order.orderItems) while rendering, which needs
# open-session-in-view. Turning it off requires fetch-joining what each page needs first.
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.flyway.enabled=true
# Databases created earlier by ddl-auto=update have no flyway history: mark them as version 1 and apply V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.sql.init.mode=never

# --- Web ---
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-stacktrace=never
server.error.include-message=never

# --- App ---
# Demo-only: on startup, push the end time of LIVE auctions that already ended 7 days into the future.
# Never enable this against real data: it re-opens finished auctions.
app.demo.refresh-stale-auctions=${DEMO_REFRESH_STALE_AUCTIONS:false}
# How often (ms) auction statuses are synced (UPCOMING -> LIVE -> ENDED) and their notifications sent.
app.auctions.sync-interval-ms=15000
